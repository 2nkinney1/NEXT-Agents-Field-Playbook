<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/ergo-next-design-system-019dcfd7-4838-70c6-a592-2f290c5c2525/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <script src="_ds/ergo-next-design-system-019dcfd7-4838-70c6-a592-2f290c5c2525/_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; background: var(--en-canvas); }
    @keyframes errpop { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes errfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--en-canvas);font-family:var(--en-font-sans);color:var(--en-text);">

  <header style="background:#fff;border-bottom:1px solid var(--en-divider);">
    <div style="max-width:1240px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-sizing:border-box;">
      <div style="display:flex;align-items:center;gap:16px;">
        <img src="assets/logo/ergo-next-mre-horizontal-red.svg" alt="ERGO NEXT" style="height:30px;width:auto;display:block;">
        <span style="width:1px;height:30px;background:var(--en-divider);"></span>
        <span style="font-weight:700;font-size:17px;color:var(--en-text);">{{ brandName }}</span>
      </div>
      <a href="COB Coverage Field Playbook.dc.html" class="en-btn en-btn--text en-btn--sm" style="text-decoration:none;"><i class="ti ti-arrow-left"></i> Back to playbook</a>
    </div>
  </header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;box-sizing:border-box;">
    <div style="width:100%;max-width:560px;text-align:center;animation:errpop .4s var(--en-ease);">

      <div style="display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:var(--en-rose-50);margin:0 auto 28px;animation:errfloat 4s ease-in-out infinite;">
        <i class="ti {{ icon }}" style="font-size:46px;line-height:1;color:var(--en-burgundy);"></i>
      </div>

      <p style="font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--en-burgundy);margin:0 0 12px;">{{ code }}</p>

      <h1 style="font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:0 0 16px;text-wrap:balance;">{{ headline }}</h1>

      <p style="font-size:17px;line-height:1.55;color:var(--en-text-muted);margin:0 auto 32px;max-width:44ch;text-wrap:pretty;">{{ body }}</p>

      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">
        <a href="COB Coverage Field Playbook.dc.html" class="en-btn en-btn--primary" style="text-decoration:none;"><i class="ti ti-home"></i> Back to playbook</a>
        <button onClick="{{ onReload }}" class="en-btn en-btn--secondary"><i class="ti ti-refresh"></i> Try again</button>
      </div>

      <div style="margin-top:40px;padding-top:28px;border-top:1px solid var(--en-divider);">
        <p style="font-size:14px;line-height:1.55;color:var(--en-text-subtle);margin:0;text-wrap:pretty;"><br></p>
      </div>

    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:720},&quot;brandName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Producer Playbook&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;code&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Error 404&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ti-compass-off&quot;,&quot;options&quot;:[&quot;ti-compass-off&quot;,&quot;ti-alert-triangle&quot;,&quot;ti-plug-connected-x&quot;,&quot;ti-lock&quot;,&quot;ti-server-off&quot;,&quot;ti-mood-empty&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;We can't find that page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The link may be outdated or the page was moved. Head back to the playbook and pick up where you left off.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;supportEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;enablement@ergonext.com&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      brandName: p.brandName ?? "Producer Playbook",
      code: p.code ?? "Error 404",
      icon: p.icon ?? "ti-compass-off",
      headline: p.headline ?? "We can't find that page",
      body: p.body ?? "The link may be outdated or the page was moved. Head back to the playbook and pick up where you left off.",
      supportEmail: p.supportEmail ?? "enablement@ergonext.com",
      onReload: () => { try { window.location.reload(); } catch (e) {} },
    };
  }
}
</script>
</body>
</html>
